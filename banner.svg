    <text x="720" y="62">BufferedReader br = new BufferedReader(</text>
    <text x="745" y="102">new FileReader("notas.txt"));</text>
    <text x="720" y="142">while ((linea = br.readLine()) != null) {</text>
    <text x="745" y="182">System.out.println(linea);</text>
    <text x="720" y="222">}</text>
