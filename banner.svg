      <stop offset="0.5" stop-color="#1e0b3a"/>
      <stop offset="1" stop-color="#0a0612"/>
    </radialGradient>
    <linearGradient id="tg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c084fc"/>
